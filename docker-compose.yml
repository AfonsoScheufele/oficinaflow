services:
  postgres:
    image: postgres:16-alpine
    container_name: oficinaflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oficinaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficinaflow}
      POSTGRES_DB: ${POSTGRES_DB:-oficinaflow}
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oficinaflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oficinaflow-redis
    ports:
      - "6383:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
